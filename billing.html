<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Billing — Bahadur Tours and Travels</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="invoice.css">
</head>
<body>
<main class="ad-main">
  <div class="tabs bill-mobile-tabs" id="mobile-tabs"><button class="active" data-view="form">Edit</button><button data-view="preview">Preview</button></div>
  <div class="bill" id="bill">
    <form class="bill-form" id="bill-form" autocomplete="off">

      <details class="sec" open><summary><span class="n">1</span>Document<small id="sum-doc"></small></summary><div>
        <div class="tabs" id="doc-type" style="margin-bottom:10px"><button type="button" data-type="invoice" class="active">Invoice</button><button type="button" data-type="quotation">Quotation</button></div>
        <div class="form-grid">
          <label class="field full"><span>Number</span><input name="invoice_number" placeholder="Created when you save"></label>
          <label class="field"><span>Date</span><input type="date" name="invoice_date" required></label>
          <label class="field"><span id="due-label">Due date</span><input type="date" name="due_date"></label>
          <label class="field"><span>Status</span><select name="status"><option>Draft</option><option>Sent</option></select></label>
          <label class="field"><span>Booking reference</span><input name="booking_ref" list="booking-refs" placeholder="BT12345678"></label>
        </div>
      </div></details>

      <details class="sec" open><summary><span class="n">2</span>Customer<small id="sum-customer"></small></summary><div>
        <div class="form-grid">
          <label class="field full"><span>Customer name <em>*</em></span><input name="customer_name" list="customer-list" required placeholder="Start typing to pick a saved customer"></label>
          <label class="field"><span>Phone</span><input name="phone" placeholder="+91"></label>
          <label class="field"><span>Email</span><input name="email" type="email"></label>
          <label class="field full"><span>Billing address</span><textarea name="customer_address" rows="2"></textarea></label>
          <label class="field"><span>Customer GSTIN</span><input name="customer_gstin" placeholder="Optional"></label>
          <label class="field"><span>Place of supply</span><input name="place_of_supply" placeholder="Karnataka"></label>
        </div>
      </div></details>

      <details class="sec" open><summary><span class="n">3</span>Journey<small id="sum-trip"></small></summary><div>
        <div class="form-grid">
          <label class="field full"><span>Package</span><input name="td.package_name" list="package-list" placeholder="Pick a package or type a custom journey"></label>
          <label class="field"><span>Trip type</span><select name="td.package_type"><option value="domestic">Domestic</option><option value="international">International</option><option value="pilgrimage">Pilgrimage</option><option value="transport">Vehicle hire</option></select></label>
          <label class="field"><span>Destination</span><input name="td.destination"></label>
          <label class="field"><span>Travel date</span><input type="date" name="td.travel_date"></label>
          <label class="field"><span>Return date</span><input type="date" name="td.return_date"></label>
        </div>
      </div></details>

      <details class="sec"><summary><span class="n">4</span>Travellers<small id="sum-pax">None added</small></summary><div>
        <div class="row-line row-pax row-head"><span>Name</span><span>Type</span><span>Age</span><span class="pp">Passport / ID</span><span></span></div>
        <div class="rows" id="pax-rows"></div>
        <div class="chips"><button type="button" id="add-pax">+ Add traveller</button><button type="button" id="same-as-customer">Use customer name</button></div>
        <label class="field" style="margin-top:10px"><span>Or paste a list (one per line: Name - Age)</span><textarea id="pax-paste" rows="2" placeholder="Rahul Sharma - 35&#10;Aarav Sharma - 8"></textarea></label>
        <button type="button" class="btn sm" id="pax-apply" style="margin-top:6px">Add these names</button>
      </div></details>

      <details class="sec"><summary><span class="n">5</span>Flight &amp; stay<small id="sum-extra">Not included</small></summary><div>
        <label class="check"><input type="checkbox" name="td.flight.included"> Show flight on the invoice</label>
        <div class="form-grid" id="flight-fields" style="margin-top:8px" hidden>
          <label class="field"><span>Airline</span><input name="td.flight.airline"></label>
          <label class="field"><span>Flight no.</span><input name="td.flight.number"></label>
          <label class="field"><span>From</span><input name="td.flight.from"></label>
          <label class="field"><span>To</span><input name="td.flight.to"></label>
          <label class="field"><span>Departure</span><input type="datetime-local" name="td.flight.departure"></label>
          <label class="field"><span>Arrival</span><input type="datetime-local" name="td.flight.arrival"></label>
          <label class="field"><span>PNR</span><input name="td.flight.pnr"></label>
          <label class="field"><span>Cabin</span><select name="td.flight.cabin"><option>Economy</option><option>Premium economy</option><option>Business</option><option>First</option></select></label>
          <label class="field full"><span>Baggage</span><input name="td.flight.baggage" placeholder="20 kg checked + 7 kg cabin"></label>
        </div>
        <label class="check" style="margin-top:12px"><input type="checkbox" name="td.hotel.included"> Show hotel on the invoice</label>
        <div class="form-grid" id="hotel-fields" style="margin-top:8px" hidden>
          <label class="field full"><span>Hotel</span><input name="td.hotel.name"></label>
          <label class="field"><span>City</span><input name="td.hotel.city"></label>
          <label class="field"><span>Category</span><input name="td.hotel.category" placeholder="4 star"></label>
          <label class="field"><span>Check-in</span><input type="date" name="td.hotel.checkin"></label>
          <label class="field"><span>Check-out</span><input type="date" name="td.hotel.checkout"></label>
          <label class="field"><span>Room type</span><input name="td.hotel.room_type"></label>
          <label class="field"><span>Rooms</span><input type="number" min="1" name="td.hotel.rooms"></label>
          <label class="field"><span>Meal plan</span><input name="td.hotel.meals"></label>
          <label class="field"><span>Confirmation no.</span><input name="td.hotel.confirmation"></label>
        </div>
      </div></details>

      <details class="sec" open><summary><span class="n">6</span>Charges &amp; tax<small id="sum-total"></small></summary><div>
        <div class="row-line row-charge row-head"><span>Description</span><span class="sac">SAC</span><span>Qty</span><span>Rate ₹</span><span></span></div>
        <div class="rows" id="line-rows"></div>
        <div class="chips" id="quick-lines"><button type="button" data-line="">+ Add charge</button><button type="button" data-line="Package cost – adult">Adult</button><button type="button" data-line="Package cost – child">Child</button><button type="button" data-line="Flight tickets">Flight</button><button type="button" data-line="Hotel accommodation">Hotel</button><button type="button" data-line="Visa charges">Visa</button><button type="button" data-line="Ground transfers">Transfers</button><button type="button" data-line="Service fee">Service fee</button></div>
        <div class="form-grid" style="margin-top:12px">
          <label class="field"><span>Discount ₹</span><input type="number" min="0" step="0.01" name="discount"></label>
          <label class="field"><span>Tax</span><select name="tax_mode"><option value="none">No tax</option><option value="cgst_sgst">CGST + SGST (in state)</option><option value="igst">IGST (other state)</option></select></label>
          <label class="field" id="tax-rate-field"><span>GST rate %</span><input type="number" min="0" step="0.01" name="tax_rate"></label>
        </div>
        <div class="sum" id="sum-box"></div>
      </div></details>

      <details class="sec" id="payment-sec" open><summary><span class="n">7</span>Payment<small id="sum-paid"></small></summary><div>
        <div id="advance-box" class="form-grid">
          <label class="field"><span>Advance received ₹</span><input type="number" min="0" step="0.01" id="advance-amount" placeholder="0"></label>
          <label class="field"><span>Paid by</span><select id="advance-mode"><option>UPI</option><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Cheque</option></select></label>
          <label class="field full"><span>Payment reference</span><input id="advance-ref" placeholder="UTR or transaction number"></label>
        </div>
        <div id="ledger-box" hidden>
          <table class="ledger" id="ledger"></table>
          <div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap"><button type="button" class="btn sm primary" id="add-payment"><i class="hgi-stroke hgi-add-01"></i>Record payment</button><button type="button" class="btn sm" id="add-refund">Record refund</button></div>
        </div>
        <div class="form-grid" style="margin-top:12px">
          <label class="field full"><span>Payment instructions</span><textarea name="payment_details" rows="2" placeholder="Bank and UPI details come from Business settings. Add anything extra here."></textarea></label>
          <label class="field full"><span>Invoice note</span><textarea name="notes" rows="2"></textarea></label>
          <label class="field full"><span>Remarks</span><textarea name="payment_remarks" rows="2"></textarea></label>
        </div>
      </div></details>
    </form>

    <section class="bill-preview" aria-label="Invoice preview">
      <div class="stage" id="stage"><div class="stage-inner" id="sheet"></div></div>
    </section>
  </div>
</main>

<datalist id="customer-list"></datalist>
<datalist id="package-list"></datalist>
<datalist id="booking-refs"></datalist>
<script src="assets/vendor/qrcode.js"></script>
<script type="module" src="billing.js"></script>
</body>
</html>
