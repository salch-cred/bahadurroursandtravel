<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Itinerary — Bahadur Tours and Travels</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#e0f2fe;color:#0c2740;font:400 13.5px/1.5 'Instrument Sans',Arial,sans-serif}
.bar{display:flex;justify-content:center;gap:8px;padding:14px}
.bar button{border:0;background:#0284c7;color:#fff;font:inherit;font-weight:600;padding:10px 20px;border-radius:99px;cursor:pointer}
.sheet{width:794px;max-width:100%;min-height:1123px;margin:0 auto 24px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.top{height:9px;background:linear-gradient(90deg,#7dd3fc,#0ea5e9 45%,#0369a1)}
header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 36px}
header img{width:118px;height:auto}
header div{text-align:right;font-size:12px;color:#577087}
.cover{height:230px;position:relative;background:#0369a1 center/cover no-repeat}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,30,60,.75),transparent 60%)}
.cover div{position:absolute;left:36px;right:36px;bottom:18px;z-index:1;color:#fff}
.cover h1{font:600 34px/1.1 'Bricolage Grotesque',Arial,sans-serif;margin:0 0 4px}
main{padding:18px 36px;flex:1}
h2{font:600 18px 'Bricolage Grotesque',Arial,sans-serif;color:#0369a1;margin:14px 0 8px}
.day{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed #cfe6f7;break-inside:avoid}
.day b{color:#0284c7;font-weight:600}
.day strong{font-weight:600;display:block}
.day span{color:#577087}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:#eff8ff;border-radius:11px;padding:10px 14px;break-inside:avoid}
ul{margin:0;padding-left:17px}
footer{background:linear-gradient(90deg,#0369a1,#0ea5e9);color:#fff;padding:9px 36px;display:flex;justify-content:space-between;font-size:12px}
@page{size:A4;margin:0}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;width:210mm;min-height:296mm}}
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Print or save as PDF</button></div>
<article class="sheet" id="sheet"><div class="top"></div><main><p>Loading itinerary…</p></main></article>
<script>
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const list = (v) => { if (Array.isArray(v)) return v; try { const j = JSON.parse(v); return Array.isArray(j) ? j : []; } catch { return String(v || '').split('\n').filter(Boolean); } };
const line = (x) => (typeof x === 'object' && x ? [x.title, x.description || x.desc].filter(Boolean).join(': ') : String(x));
(async () => {
  const sheet = document.getElementById('sheet');
  try {
    const slug = new URLSearchParams(location.search).get('slug');
    const res = await fetch('/api/packages?slug=' + encodeURIComponent(slug || ''));
    if (!res.ok) throw new Error();
    const { package: p } = await res.json();
    document.title = p.name + ' itinerary — Bahadur Tours and Travels';
    const days = list(p.itinerary).map(line), inc = list(p.included).map(line), exc = list(p.excluded).map(line), hl = list(p.highlights).map(line);
    sheet.innerHTML = `<div class="top"></div>
      <header><img src="assets/brand/bahadur-logo.png" alt="Bahadur Tours and Travels"><div>+91 91874 40916<br>bahadurtourstravels@gmail.com</div></header>
      <div class="cover" style="background-image:url('${esc(p.image_url || 'assets/images/island-beach.jpg')}')"><div><h1>${esc(p.name)}</h1>${esc([p.region, p.duration, p.price].filter(Boolean).join(' · '))}</div></div>
      <main><p>${esc(p.description || p.summary || '')}</p>
      ${hl.length ? `<h2>Highlights</h2><ul>${hl.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${days.length ? `<h2>Day by day</h2>${days.map((d, i) => { const at = d.indexOf(':'); const has = at > 0 && at < 60; return `<div class="day"><b>Day ${i + 1}</b><div><strong>${esc(has ? d.slice(0, at) : d)}</strong>${has ? `<span>${esc(d.slice(at + 1).trim())}</span>` : ''}</div></div>`; }).join('')}` : ''}
      <div class="two"><div><h2>Included</h2><div class="box"><ul>${inc.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div><div><h2>Not included</h2><div class="box"><ul>${exc.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div></div>
      ${p.terms ? `<h2>Package terms</h2><p>${esc(p.terms)}</p>` : ''}</main>
      <footer><span>Thank you for travelling with Bahadur.</span><span>Final schedule is confirmed in your quotation.</span></footer>`;
  } catch {
    sheet.innerHTML = '<div class="top"></div><main><h2>Itinerary not found</h2><p>Please go back to the package page and try again.</p></main>';
  }
})();
</script>
</body>
</html>
