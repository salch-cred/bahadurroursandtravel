<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Package Publishing — Bahadur Tours</title><link rel="stylesheet" href="styles.css">    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
</head><body class="admin-page"><header class="nav-wrap"><nav class="nav glass"><a class="brand" href="admin.html"><img src="assets/bahadur-logo.png" alt="Bahadur"><span>Package publishing</span></a><div class="nav-links"><a href="admin.html">Dashboard</a><a href="billing.html">Billing</a><a href="media-manager.html">Media</a></div><a class="btn btn-small" href="booking.html">View website <i class="hgi-stroke hgi-arrow-up-right-01"></i></a></nav></header><main class="package-admin-shell enhanced-package-admin"><section class="package-editor glass"><span class="kicker">Catalogue editor</span><h1>Publish a complete package.</h1><form id="package-form"><input type="hidden" name="id"><div class="form-grid"><label>Package name<input name="name" required></label><label>URL slug<input name="slug" required></label><label>Package type<select name="package_type" id="package-type"><option value="domestic">Domestic</option><option value="international">International</option></select></label><label>Category<input name="category"></label><label>Destination / region<input name="region"></label><label>Duration<input name="duration"></label><label>Price label<input name="price" placeholder="From ₹24,900"></label><label class="span-2">Primary image URL<input name="image_url"></label><label class="span-2">Gallery image URLs — one per line<textarea name="gallery" rows="3"></textarea></label><label class="span-2">Short card summary<textarea name="summary" rows="2"></textarea></label><label class="span-2">Complete package description<textarea name="description" rows="5"></textarea></label><label>Latitude<input name="latitude" type="number" step="any"></label><label>Longitude<input name="longitude" type="number" step="any"></label><label class="span-2">Highlights — one per line<textarea name="highlights" rows="4"></textarea></label><label class="span-2">Day-by-day itinerary — one day per line<textarea name="itinerary" rows="6"></textarea></label><label class="span-2">Included — one per line<textarea name="included" rows="4"></textarea></label><label class="span-2">Not included — one per line<textarea name="excluded" rows="4"></textarea></label></div><fieldset class="package-subsection international-package-fields" id="package-flight-fields"><legend>International flight options</legend><div class="form-grid"><label class="consent span-2"><input type="checkbox" name="flight_included"> Flight ticket included</label><label>Preferred airline<input name="flight_airline"></label><label>Cabin class<select name="flight_cabin"><option>Economy</option><option>Premium economy</option><option>Business</option></select></label><label>Departure airport<input name="flight_from"></label><label>Arrival airport<input name="flight_to"></label><label class="span-2">Baggage allowance<input name="flight_baggage"></label></div></fieldset><fieldset class="package-subsection"><legend>Accommodation options</legend><div class="form-grid"><label class="consent span-2"><input type="checkbox" name="hotel_included"> Accommodation included</label><label>Hotel / property<input name="hotel_name"></label><label>City<input name="hotel_city"></label><label>Category<input name="hotel_category" placeholder="4 star"></label><label>Room type<input name="hotel_room_type"></label><label>Rooms<input name="hotel_rooms" type="number" min="1"></label><label>Meal plan<input name="hotel_meals"></label></div></fieldset><div class="form-grid"><label class="span-2">Package-specific terms<textarea name="terms" rows="4"></textarea></label><label class="consent span-2"><input type="checkbox" name="active" checked> Visible on website</label><div class="package-editor-actions span-2"><button class="btn" type="submit">Save package</button><button class="btn btn-outline" type="button" id="package-reset">Clear</button></div><small class="span-2" id="package-state"></small></div></form></section><section class="package-library glass"><div class="panel-head"><div><span class="kicker">Neon catalogue</span><h2>Published packages.</h2></div><button class="mini-btn" id="package-refresh">Refresh</button></div><div id="admin-package-list" class="admin-package-list"></div></section></main><dialog class="admin-login" id="package-login"><form method="dialog" id="package-login-form"><img src="assets/bahadur-logo.png" alt="Bahadur"><span class="kicker">Authorised staff only</span><h2>Unlock package manager</h2><label>Admin token<input type="password" id="package-token" required></label><button class="btn btn-dark full">Continue</button></form></dialog><script type="module" src="packages-admin.js"></script></body></html>
